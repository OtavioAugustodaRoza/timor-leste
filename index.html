<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        const saved = localStorage.getItem('timor-atlas-theme');
        const theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Um atlas vivo do Timor-Leste. Conheça suas paisagens, cultura, história, economia e a defesa da democracia e dos direitos humanos." />
    <meta property="og:title" content="Timor-Leste — A força de ser livre" />
    <meta property="og:description" content="Uma viagem pela terra, pelas memórias e pelo futuro do Timor-Leste." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timor-leste-atlas-vivo.exactrice514.chatgpt.site" />
    <meta property="og:image" content="https://timor-leste-atlas-vivo.exactrice514.chatgpt.site/images/coast.webp" />
    <link rel="canonical" href="https://timor-leste-atlas-vivo.exactrice514.chatgpt.site" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Timor-Leste — A força de ser livre</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para explorar este atlas interativo do Timor-Leste.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
